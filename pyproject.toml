[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onesite"
version = "0.1.17"
description = "A CLI tool to generate full-stack web projects from SQLModel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]",
    "jinja2",
    "sqlmodel",
    "pydantic",
    "rich",
    "uvicorn",
    "fastapi"
]

[dependency-groups]
dev = [
    "apscheduler>=3.10,<4",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.13,<0.14",
]

[project.scripts]
site = "onesite.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/onesite", "src/onesite_runtime"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/README.zh-CN.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "examples",
    "临时",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/onesite/templates/backend/app/core/config.py" = ["F821"]
"src/onesite/templates/site_config.py" = ["F821"]
"src/onesite/templates/visualizations.py" = ["F401"]
