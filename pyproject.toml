[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onesite"
version = "0.1.17"
description = "A CLI tool to generate full-stack web projects from SQLModel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]",
    "jinja2",
    "sqlmodel",
    "pydantic",
    "rich",
    "uvicorn",
    "fastapi"
]

[project.scripts]
site = "onesite.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/onesite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
